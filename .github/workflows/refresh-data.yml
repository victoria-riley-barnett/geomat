name: Refresh data sources

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        run: python3 scripts/fetch_capital.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/data/capital/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push if data changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/capital/
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)

          Sources: World Bank NY.GDP.MKTP.CD
          $(git diff --cached --stat | tail -1)"
          git push
